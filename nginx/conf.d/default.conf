server_tokens off;

# DNS embarqué de Docker : résolution dynamique des upstreams
resolver 127.0.0.11 valid=10s ipv6=off;

# IP réelle : on ne fait confiance à CF-Connecting-IP que si la requête
# vient du sous-réseau edge (tunnel Cloudflare sur l'hôte -> gateway Docker)
set_real_ip_from 172.31.250.0/24;
real_ip_header   CF-Connecting-IP;
real_ip_recursive off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    ''      $server_port;
}

# Rate limiting ciblé sur les logins, sans dupliquer les location :
# une clé vide n'est pas limitée, seules les URLs de login ont une clé.
map $request_uri $login_key {
    default                              "";
    ~^/j_spring_security_check           $binary_remote_addr;
    ~^/api/authentication/login          $binary_remote_addr;
}
limit_req_zone $login_key zone=login:10m rate=10r/m;
limit_req_status 429;

# Catch-all : tout Host inconnu est coupé sans réponse
server {
    listen 80 default_server;
    server_name _;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /          { return 444; }
}

server {
    listen 8082 default_server;
    server_name _;
    return 444;
}

# Jenkins
server {
    listen 80;
    server_name jenkins.hakilox.com;

    client_max_body_size 50m;
    limit_req zone=login burst=5 nodelay;

    location / {
        set $jenkins_upstream http://jenkins:8080;
        proxy_pass $jenkins_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Console de build en temps réel et uploads sans fichiers temporaires
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }
}

# SonarQube
server {
    listen 8082;
    server_name sonar.hakilox.com;

    client_max_body_size 100m;
    limit_req zone=login burst=5 nodelay;

    location / {
        set $sonar_upstream http://sonarqube:9000;
        proxy_pass $sonar_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;

        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }
}